{% extends 'layout.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">用户注册</h2>
  <form method="POST">
    <input name="username" placeholder="用户名" class="w-full border p-2 mb-3" required>
    <input type="password" name="password" placeholder="密码" class="w-full border p-2 mb-3" required>
    <button class="bg-green-500 hover:bg-green-600 text-white py-2 w-full rounded">注册</button>
  </form>
  <p class="text-center mt-3 text-sm">已有账号？<a href="{{ url_for('user.login') }}" class="text-green-500">登录</a></p>
</div>
{% endblock %}

{% extends 'layout.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">用户登录</h2>
  <form method="POST">
    <input name="username" placeholder="用户名" class="w-full border p-2 mb-3" required>
    <input type="password" name="password" placeholder="密码" class="w-full border p-2 mb-3" required>
    <button class="bg-blue-500 hover:bg-blue-600 text-white py-2 w-full rounded">登录</button>
  </form>
  <p class="text-center mt-3 text-sm">还没有账号？<a href="{{ url_for('user.register') }}" class="text-blue-500">注册</a></p>
</div>
{% endblock %}

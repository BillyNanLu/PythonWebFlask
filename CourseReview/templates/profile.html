{% extends 'layout.html' %}
{% block content %}
<div class="max-w-lg mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">个人中心</h2>
  <p><strong>用户名：</strong>{{ user.username }}</p>
  <p><strong>角色：</strong>{{ '管理员' if user.role == 1 else '普通用户' }}</p>
  <p><strong>注册时间：</strong>{{ user.create_time.strftime('%Y-%m-%d %H:%M') }}</p>
  <a href="{{ url_for('user.logout') }}" class="text-blue-500 mt-4 inline-block">退出登录</a>
</div>
{% endblock %}

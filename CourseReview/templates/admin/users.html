{% extends 'admin/layout.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">用户管理</h1>

<div class="bg-white p-6 rounded-lg shadow-md">
  <table class="w-full border-collapse">
    <thead>
      <tr class="bg-gray-100 text-gray-700 text-left">
        <th class="p-3 border-b">ID</th>
        <th class="p-3 border-b">用户名</th>
        <th class="p-3 border-b">角色</th>
        <th class="p-3 border-b">注册时间</th>
        <th class="p-3 border-b text-right">操作</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr class="hover:bg-gray-50 transition">
        <td class="p-3 border-b">{{ u.id }}</td>
        <td class="p-3 border-b">{{ u.username }}</td>
        <td class="p-3 border-b">
          {% if u.role == 1 %}
            <span class="text-red-600 font-semibold">管理员</span>
          {% else %}
            普通用户
          {% endif %}
        </td>
        <td class="p-3 border-b">{{ u.create_time.strftime('%Y-%m-%d %H:%M') }}</td>
        <td class="p-3 border-b text-right space-x-3">

          <!-- 切换角色 -->
          <form action="{{ url_for('admin.toggle_user_role', user_id=u.id) }}" method="POST" class="inline">
            <button type="submit" class="text-blue-600 hover:text-blue-800 text-sm">
              {% if u.role == 1 %}降为普通用户{% else %}设为管理员{% endif %}
            </button>
          </form>

          <!-- 删除用户 -->
          <form action="{{ url_for('admin.delete_user', user_id=u.id) }}" method="POST" class="inline"
                onsubmit="return confirm('确定要删除用户 {{ u.username }} 吗？');">
            <button type="submit" class="text-red-500 hover:text-red-700 text-sm">删除</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  {% if not users %}
  <p class="text-center text-gray-500 py-4">暂无用户。</p>
  {% endif %}
</div>
{% endblock %}

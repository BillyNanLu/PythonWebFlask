{% extends 'admin/layout.html' %}
{% block content %}
<div class="max-w-6xl mx-auto mt-16">
  <h1 class="text-3xl font-bold text-gray-800 mb-8">📊 管理员控制面板</h1>

  <!-- 统计卡片区 -->
  <div class="grid md:grid-cols-4 gap-6">
    <!-- 用户数 -->
    <div class="bg-white shadow rounded-2xl p-6 text-center hover:shadow-lg transition">
      <h2 class="text-4xl font-bold text-blue-600">{{ user_count }}</h2>
      <p class="text-gray-600 mt-2">注册用户</p>
    </div>

    <!-- 课程数 -->
    <div class="bg-white shadow rounded-2xl p-6 text-center hover:shadow-lg transition">
      <h2 class="text-4xl font-bold text-green-600">{{ course_count }}</h2>
      <p class="text-gray-600 mt-2">课程数量</p>
    </div>

    <!-- 评论数 -->
    <div class="bg-white shadow rounded-2xl p-6 text-center hover:shadow-lg transition">
      <h2 class="text-4xl font-bold text-yellow-500">{{ review_count }}</h2>
      <p class="text-gray-600 mt-2">评价总数</p>
    </div>

    <!-- 平均评分 -->
    <div class="bg-white shadow rounded-2xl p-6 text-center hover:shadow-lg transition">
      <h2 class="text-4xl font-bold text-red-500">{{ avg_rating }}</h2>
      <p class="text-gray-600 mt-2">平均评分</p>
    </div>
  </div>

  <!-- 欢迎提示 -->
  <div class="mt-10 bg-blue-50 p-6 rounded-xl border border-blue-200">
    <h2 class="text-xl font-semibold text-blue-700 mb-2">欢迎回来，管理员 {{ session.username }} 👋</h2>
    <p class="text-gray-700">
      您可以在左侧菜单中管理课程、用户和评论。
      如果当前未登录管理员账号，请重新登录。
    </p>
  </div>
</div>
{% endblock %}

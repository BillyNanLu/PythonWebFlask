{% extends 'admin/layout.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">新增课程</h1>

<form method="POST" class="bg-white p-6 rounded-lg shadow-md space-y-4 max-w-lg">
  <div>
    <label class="block text-gray-700 mb-1">课程名称</label>
    <input type="text" name="name" required
           class="border rounded w-full p-2" placeholder="请输入课程名称">
  </div>
  <div>
    <label class="block text-gray-700 mb-1">教师</label>
    <input type="text" name="teacher" class="border rounded w-full p-2" placeholder="请输入教师姓名">
  </div>
  <div>
    <label class="block text-gray-700 mb-1">课程描述</label>
    <textarea name="description" rows="4" class="border rounded w-full p-2" placeholder="课程简介"></textarea>
  </div>

  <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
    保存
  </button>
  <a href="{{ url_for('admin.courses') }}" class="ml-4 text-gray-600 hover:underline">取消</a>
</form>
{% endblock %}

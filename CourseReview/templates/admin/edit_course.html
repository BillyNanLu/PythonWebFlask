{% extends 'admin/layout.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">编辑课程</h1>

<form method="POST" class="bg-white p-6 rounded-lg shadow-md space-y-4 max-w-lg">
  <div>
    <label class="block text-gray-700 mb-1">课程名称</label>
    <input type="text" name="name" required
           class="border rounded w-full p-2"
           value="{{ course.name }}">
  </div>
  <div>
    <label class="block text-gray-700 mb-1">教师</label>
    <input type="text" name="teacher" class="border rounded w-full p-2"
           value="{{ course.teacher }}">
  </div>
  <div>
    <label class="block text-gray-700 mb-1">课程描述</label>
    <textarea name="description" rows="4" class="border rounded w-full p-2">{{ course.description }}</textarea>
  </div>

  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
    保存修改
  </button>
  <a href="{{ url_for('admin.courses') }}" class="ml-4 text-gray-600 hover:underline">取消</a>
</form>
{% endblock %}

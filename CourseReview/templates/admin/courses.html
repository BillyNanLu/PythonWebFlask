{% extends 'admin/layout.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">课程管理</h1>

<!-- 新增课程按钮 -->
<a href="{{ url_for('admin.add_course') }}"
   class="inline-block mb-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
   + 新增课程
</a>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
  {% for course in courses %}
  <div class="bg-white p-4 shadow rounded-lg hover:shadow-lg relative">
    <h3 class="text-lg font-semibold text-blue-700">{{ course.name }}</h3>
    <p class="text-gray-600">教师：{{ course.teacher }}</p>
    <p class="text-gray-500 mt-1 line-clamp-3">{{ course.description[:80] }}...</p>
    <p class="text-xs text-gray-400 mt-2">创建时间：{{ course.create_time.strftime('%Y-%m-%d %H:%M') }}</p>

    <!-- 删除按钮 -->
    <form method="POST" action="{{ url_for('admin.delete_course', course_id=course.id) }}"
          onsubmit="return confirm('确定删除这门课程吗？');"
          class="absolute top-4 right-4">
      <button type="submit" class="text-red-500 hover:text-red-700 font-semibold text-sm">
        删除
      </button>
    </form>

    <!-- 编辑按钮 -->
    <a href="{{ url_for('admin.edit_course', course_id=course.id) }}"
       class="absolute top-4 right-16 text-blue-500 hover:text-blue-700 font-semibold text-sm">
      编辑
    </a>
  </div>
  {% else %}
  <p class="col-span-3 text-center text-gray-500">暂无课程</p>
  {% endfor %}
</div>
{% endblock %}

{% extends 'layout.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto mt-2 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
  <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">修改密码</h2>

  <form method="POST" class="space-y-6">
    <div>
      <label class="block text-gray-700 font-medium mb-2">原密码</label>
      <input type="password" name="old_password"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
             required placeholder="请输入原密码">
    </div>
    <div>
      <label class="block text-gray-700 font-medium mb-2">新密码</label>
      <input type="password" name="new_password"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
             required placeholder="请输入新密码">
    </div>
    <div>
      <label class="block text-gray-700 font-medium mb-2">确认新密码</label>
      <input type="password" name="confirm_password"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
             required placeholder="请再次输入新密码">
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md hover:shadow-lg">
      提交修改
    </button>
  </form>

  <div class="text-center mt-6">
    <a href="{{ url_for('user.profile') }}" class="text-blue-500 hover:text-blue-700 hover:underline">返回个人中心</a>
  </div>
</div>

{% endblock %}
